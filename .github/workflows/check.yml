name: Check local skill release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Source and distribution checks
        run: python tools/check_release.py
      - name: Build deterministic packages
        run: python tools/build_release.py
      - name: Fresh installation smoke
        run: python tools/beta_smoke.py
